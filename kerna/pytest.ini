[pytest]
pythonpath = comun nucleo conector pruebas pipeline_bcn evaluacion servicio_local
testpaths = pruebas/unitarias
timeout = 60
markers =
    pr(id): caso de prueba del informe que verifica (PR-01 a PR-39)
    rf(id): requerimiento funcional
    rnf(id): requerimiento no funcional
    cu(id): caso de uso
    integracion: usa servicios reales (Azure, Gemini, Voyage, Qdrant, Mongo)
    e2e: Playwright contra Veridy
    carga: pruebas de carga
