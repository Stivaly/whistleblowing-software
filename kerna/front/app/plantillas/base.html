<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}Kerna AI{% endblock %}</title>
<meta name="description" content="Kerna AI sugiere las leyes y artículos chilenos aplicables a una denuncia dentro de Veridy.">
<meta name="theme-color" content="#1C2A6B">
<link rel="icon" type="image/svg+xml" href="/estaticos/img/favicon.svg">
<link rel="preload" href="/estaticos/fuentes/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/estaticos/fuentes/unbounded-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/estaticos/kerna.css?v={{ ver }}"><link rel="stylesheet" href="/estaticos/tailwind.css?v={{ ver }}">
</head>
<body>
<div id="tt" role="tooltip"></div>
<a class="skip" href="#main">Saltar al contenido</a>
<div class="bgfx {% block fondo %}bg-a{% endblock %}" aria-hidden="true"><img class="b-rot b1" src="/estaticos/img/bg-orbitas.webp?v={{ ver }}" width="1600" height="1600" alt="" decoding="async"><img class="b-rot b3" src="/estaticos/img/bg-roseta.webp?v={{ ver }}" width="1600" height="1600" alt="" decoding="async"></div>
{% block pagina %}{% endblock %}
<script type="application/json" id="glosario">{{ glosario_json|safe }}</script>
{% block datos %}{% endblock %}
{% block echarts %}{% endblock %}
<script src="/estaticos/kerna.js?v={{ ver }}" defer></script>
</body></html>
