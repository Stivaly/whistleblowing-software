<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="320" height="240" style="--fondo:#1F4F7A;--txt:#FFFFFF;--acc:#FFD36B;--pi:#FFFFFF;--pf:#1F4F7A"><style>
