<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="320" height="240" style="--fondo:#E8DAF1;--txt:#43185C;--acc:#8A3FB0;--pi:#1E1B2E;--pf:#FBF6EA"><style>
