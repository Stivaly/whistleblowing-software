<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="320" height="240" style="--fondo:#33301F;--txt:#F7F1DC;--acc:#C9BE8A;--pi:#F7F1DC;--pf:#0B1020"><style>
svg{display:block;overflow:visible}.o,.o2,.of,.oz,.th,.th2,.thz,.err,.chk,.chk2,.chk3,.puntada,.seg{fill:none;stroke-linecap:round;stroke-linejoin:round}
