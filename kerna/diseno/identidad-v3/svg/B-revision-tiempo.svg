<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="320" height="240" style="--fondo:#44230A;--txt:#FFEBDD;--acc:#FF9A4D;--pi:#FFEBDD;--pf:#0B1020"><style>
