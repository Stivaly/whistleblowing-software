<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta: indicador y bloque de Kerna</title>
<!--
  Maqueta estática y autocontenida (sin recursos externos). No es código del cliente: solo sirve para ver y
  fotografiar la propuesta. Parámetros en la URL:
    ?icono=robot|v-veridy|articulo-marcado|balanza   (por defecto robot)
    &estado=sin-info|generando|lista|contingencia|revision-tiempo|revision-citas|sin-normativa|cadena-agotada|
            nucleo-no-disponible|conector-inactivo|sin-conexion|valorada   (por defecto lista)
    &variante=respaldo|local|recuperacion-local   (solo estado contingencia)
    &tooltip=1|0   (por defecto 1)   &panel=1|0   (por defecto 1)   &vista=iconos   (hoja de tamaños de los íconos)
  Los íconos de ICONOS son copia de ../svg/*.svg; los colores de ESTADOS, de ../../calcular_contraste.py.
-->
<style>
:root {
  /* Identidad de Veridy (bootstrap.scss del cliente) */
  --v-azul: #205782; --v-rojo: #DE1B1B; --v-amarillo: #FFD644;
  --v-g100: #F5F7FA; --v-g200: #EBEFF5; --v-g300: #DDE3ED; --v-g400: #C8D1E0; --v-g700: #707A8A; --v-g800: #58606E; --v-g900: #434A54; --v-negro: #1D1F24;
  /* Estado activo (se reemplaza según el estado) */
  --k-fondo: #DDF3E4; --k-texto: #11432A; --k-acento: #2E7D4F;
}
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--v-negro); font: 15px/1.45 "Inter Variable", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.pagina { max-width: 1080px; margin: 0 auto; padding: 0 16px 32px; }
.cabecera-sitio { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--v-g300); margin-bottom: 14px; }
.cabecera-sitio img { max-height: 3rem; }
.barra { display: flex; justify-content: space-between; gap: 4px; margin-bottom: 8px; }
.barra .grupo { display: flex; gap: 4px; }
.btn-o { width: 38px; height: 38px; border: 1px solid var(--v-g800); border-radius: 6px; background: #fff; color: var(--v-g800); display: inline-flex; align-items: center; justify-content: center; }
.btn-o svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Fila del indicador de Kerna (encima de la denuncia) */
.fila-kerna { display: flex; align-items: center; gap: 12px; margin: 10px 0 10px; position: relative; min-height: 36px; flex-wrap: wrap; }
.kerna-ind { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 8px; border-radius: 18px; border: 1.5px solid var(--k-borde, var(--k-acento)); background: var(--k-fondo); color: var(--k-texto); font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
.kerna-ind:hover { filter: brightness(.97); }
.kerna-ind:focus-visible { outline: 3px solid var(--v-azul); outline-offset: 2px; }
.kerna-ico { position: relative; width: 24px; height: 24px; color: var(--k-acento); display: inline-flex; }
.kerna-ico > svg.icono { width: 24px; height: 24px; }
.kerna-glifo { position: absolute; right: -7px; bottom: -7px; width: 16px; height: 16px; border-radius: 50%; background: var(--k-fondo); box-shadow: 0 0 0 1.5px var(--k-fondo); }
.kerna-glifo svg { width: 16px; height: 16px; display: block; }
.kerna-lbl { white-space: nowrap; }
.kerna-ind[data-estado="sin-info"] { border-style: dashed; }
.kerna-ind[data-estado="sin-conexion"], .kerna-ind[data-estado="valorada"] { --k-borde: var(--k-fondo); }
.kerna-ind[data-estado="sin-conexion"] .kerna-ico, .kerna-ind[data-estado="valorada"] .kerna-ico { color: #fff; }
.fila-kerna .nota-fila { color: var(--v-g800); font-size: 13px; }
/* Espera: pulso suave del anillo del glifo; desactivado con prefers-reduced-motion */
@keyframes k-giro { to { transform: rotate(360deg); } }
@keyframes k-pulso { 0%,100% { opacity: 1; } 50% { opacity: .72; } }
.kerna-ind[data-estado="generando"] .kerna-glifo svg { animation: k-giro 1.6s linear infinite; transform-origin: 50% 50%; }
.kerna-ind[data-estado="generando"] { animation: k-pulso 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .kerna-ind[data-estado="generando"], .kerna-ind[data-estado="generando"] .kerna-glifo svg { animation: none; }
}

/* Tooltip */
.kerna-tt { position: absolute; top: 44px; left: 0; z-index: 20; width: 320px; background: var(--v-negro); color: #fff; border-radius: 6px; padding: 10px 12px; font-size: 13px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0,0,0,.28); }
.kerna-tt::before { content: ""; position: absolute; top: -6px; left: 22px; border: 6px solid transparent; border-top: 0; border-bottom-color: var(--v-negro); }
.kerna-tt .t { font-weight: 700; margin-bottom: 4px; }
.kerna-tt dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
.kerna-tt dt { color: #C8D1E0; font-weight: 400; } .kerna-tt dd { margin: 0; }
.kerna-tt .abrir { margin-top: 6px; color: #C8D1E0; }
.kerna-tt kbd { background: #434A54; color: #fff; border-radius: 3px; padding: 0 4px; font: inherit; font-size: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Tarjetas (como TipInfoBox y TipCommentsBox) */
.card { border: 1px solid var(--v-g300); border-radius: 6px; background: #fff; margin-bottom: 12px; }
.card-h { padding: 10px 14px; background: var(--v-g100); border-bottom: 1px solid var(--v-g300); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-b { padding: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 700; padding: 6px 8px; } td { padding: 6px 8px; } tbody tr { background: var(--v-g100); }
.centro { text-align: center; margin-bottom: 8px; }

/* Panel */
.k-panel { border-color: var(--k-acento); border-width: 1.5px; }
.k-panel .card-h { background: var(--k-fondo); color: var(--k-texto); font-weight: 700; }
.k-panel h2 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
.k-panel h2 .icono { width: 22px; height: 22px; color: var(--k-acento); }
.k-chip { font-size: 12px; font-weight: 600; border: 1px solid var(--v-g800); color: var(--v-g900); border-radius: 10px; padding: 1px 8px; background: #fff; }
.aviso { background: var(--v-g200); color: var(--v-negro); border-left: 4px solid var(--v-g800); padding: 8px 12px; border-radius: 4px; margin-bottom: 10px; font-size: 14px; }
.aviso.cont { background: #FFF2BF; color: #4D3A00; border-left-color: #8F6B00; }
.msg { margin: 0 0 10px; } .msg b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--v-g800); }
.msg p { margin: 0 0 8px; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.btn { border: 1px solid var(--v-azul); background: var(--v-azul); color: #fff; border-radius: 6px; padding: 6px 14px; font: inherit; }
.btn.sec { background: #fff; color: var(--v-azul); }
.art { border: 1px solid var(--v-g300); border-radius: 6px; margin-bottom: 8px; }
.art-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; font-weight: 700; }
.art-b { padding: 0 12px 10px; }
.art-b p { margin: 0 0 6px; }
blockquote { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--v-g500, #AFBACC); background: var(--v-g100); font-style: italic; }
.ej { font-size: 12px; color: var(--v-g800); font-style: normal; }
a { color: var(--v-azul); }
.fila { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.val { display: inline-flex; gap: 4px; }
.val button { width: 34px; height: 34px; border: 1px solid var(--v-g800); border-radius: 6px; background: #fff; color: var(--v-g800); display: inline-flex; align-items: center; justify-content: center; }
.val button[aria-pressed="true"] { background: var(--v-azul); color: #fff; border-color: var(--v-azul); }
.val svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
textarea { width: 100%; border: 1px solid var(--v-g800); border-radius: 6px; padding: 6px 8px; font: inherit; min-height: 52px; }
.cnt { font-size: 12px; color: var(--v-g800); text-align: right; }
.chk { display: inline-flex; align-items: center; gap: 6px; }
.pie { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--v-g300); margin-top: 10px; padding-top: 8px; font-size: 13px; color: var(--v-g900); }
code { background: var(--v-g200); border-radius: 3px; padding: 1px 6px; }
.hoja { display: grid; grid-template-columns: 140px repeat(3, 80px); gap: 16px; align-items: center; padding: 24px 0; }
.hoja .i { color: var(--v-azul); } .hoja .oscuro { background: #323A49; color: #fff; padding: 8px; border-radius: 6px; }
</style>
</head>
<body>
<div class="pagina" id="raiz"></div>
<script>
"use strict";
/* ---- Íconos de marca (copia de ../svg/*.svg). En el cliente real viven en UN solo archivo. ---- */
const A = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"';
const ICONOS = {
  "robot": `<svg class="icono" ${A}><rect x="4" y="8" width="16" height="11.5" rx="3"/><path d="M12 8V4.6"/><circle cx="12" cy="3.4" r="1.2" fill="currentColor" stroke="none"/><path d="M2 12.5v3M22 12.5v3"/><circle cx="9" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1.3" fill="currentColor" stroke="none"/><path d="M9 16.6h6"/></svg>`,
  "v-veridy": `<svg class="icono" ${A}><path d="M4.5 5.5 12 19l7.5-13.5" stroke-width="2.6"/></svg>`,
  "articulo-marcado": `<svg class="icono" ${A}><path d="M6 2.8h8.4L19 7.4v13.8H6z"/><path d="M14.4 2.8v4.6H19"/><path d="M9.6 12.6h5.8M9.6 16.2h5.8"/><path d="M8.6 2.8v6.6l1.9-1.5 1.9 1.5V2.8" fill="currentColor" stroke="none"/></svg>`,
  "balanza": `<svg class="icono" ${A}><path d="M12 3.8v15.8M8 20h8M4.5 6.6h15"/><path d="M4.5 6.6 2 13.2h5z"/><path d="M2 13.2a2.5 2.5 0 0 0 5 0"/><path d="M19.5 6.6 17 13.2h5z"/><path d="M17 13.2a2.5 2.5 0 0 0 5 0"/></svg>`
};
/* ---- Glifos secundarios: una silueta distinta por estado (14 px, dentro de un círculo blanco no: relleno del acento) ---- */
const G = (inner) => `<svg viewBox="0 0 14 14" aria-hidden="true" focusable="false">${inner}</svg>`;
const GLIFOS = {
  "sin-info": G(`<circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 1.8"/>`),
  "generando": G(`<circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="23 8.4" stroke-linecap="round"/>`),
  "lista": G(`<circle cx="7" cy="7" r="6.2" fill="currentColor"/><path d="M4 7.2 6.2 9.3 10 5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`),
  "contingencia": G(`<path d="M7 .6 13.4 7 7 13.4.6 7z" fill="currentColor"/><path d="M4.4 7h5.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>`),
  "revision-tiempo": G(`<path d="M3 1.2h8M3 12.8h8M3.8 1.2c0 3 2.4 4 3.2 5.8-.8 1.800-3.200 2.800-3.200 5.800M10.200 1.200c0 3-2.400 4-3.200 5.800.8 1.800 3.200 2.800 3.200 5.800" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4.600 11.800c.6-1.200 1.400-1.800 2.400-1.800s1.800.6 2.400 1.800z" fill="currentColor"/>`),
  "revision-citas": G(`<rect x=".8" y=".8" width="12.4" height="12.4" rx="2.4" fill="currentColor"/><path d="M5.200 5.400c0-1.100.8-1.800 1.900-1.800s1.800.7 1.800 1.600c0 1.500-1.800 1.500-1.800 3" fill="none" stroke="#fff" stroke-width="1.500" stroke-linecap="round"/><circle cx="7.100" cy="10.600" r=".95" fill="#fff"/>`),
  "sin-normativa": G(`<circle cx="6" cy="6" r="4.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.300 9.300 13 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4 6h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>`),
  "cadena-agotada": G(`<path d="M4.200.8h5.600l3.400 3.400v5.600l-3.400 3.400H4.200L.8 9.800V4.200z" fill="currentColor"/><path d="M4 7h6" stroke="#fff" stroke-width="1.800" stroke-linecap="round"/>`),
  "nucleo-no-disponible": G(`<path d="M7 .8 13.400 12.600H.6z" fill="currentColor" stroke="currentColor" stroke-width="1.200" stroke-linejoin="round"/><path d="M7 5.200v3.400" stroke="#fff" stroke-width="1.600" stroke-linecap="round"/><circle cx="7" cy="10.500" r=".9" fill="#fff"/>`),
  "conector-inactivo": G(`<path d="M3.900.8h6.200l3.100 6.200-3.100 6.200H3.900L.8 7z" fill="currentColor"/><circle cx="4.300" cy="7" r="1" fill="#fff"/><circle cx="7" cy="7" r="1" fill="#fff"/><circle cx="9.700" cy="7" r="1" fill="#fff"/>`),
  "sin-conexion": G(`<circle cx="7" cy="7" r="5.600" fill="none" stroke="currentColor" stroke-width="1.800"/><path d="M3 11 11 3" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"/>`),
  "valorada": G(`<path d="M3 13V1.200M3 1.800h8l-2 3 2 3H3" fill="currentColor" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round" stroke-linecap="round"/>`)
};
/* ---- Estados: colores (iguales a calcular_contraste.py) y textos BORRADOR (la redacción final la decide otra persona) ---- */
const ESTADOS = {
  "sin-info": { fondo:"#F5F7FA", texto:"#434A54", acento:"#707A8A", etiqueta:"Sin información de Kerna", titulo:"Aún no hay información de Kerna para este caso", resumen:"Sin resultados todavía", modo:"No disponible",
    que:"Todavía no hay información de Kerna sobre este caso.", significa:"Puede que el caso sea reciente o que Kerna aún no lo haya tomado.", puedes:"Puedes clasificarlo como siempre. Si Kerna lo toma, la sugerencia aparecerá aquí.", acciones:["Actualizar"] },
  "generando": { fondo:"#DCEBF8", texto:"#12324F", acento:"#2A6496", etiqueta:"Preparando sugerencia", titulo:"Kerna está preparando la sugerencia", resumen:"Aún sin resultados", modo:"Se indicará cuando esté lista",
    que:"Kerna está revisando el caso para sugerir artículos de la normativa. Suele tardar unos minutos.", significa:"Todavía no hay sugerencia, pero tu trabajo no se bloquea.", puedes:"Puedes seguir con el caso y clasificarlo manualmente. La sugerencia aparecerá aquí cuando esté lista.", acciones:["Actualizar"] },
  "lista": { fondo:"#DDF3E4", texto:"#11432A", acento:"#2E7D4F", etiqueta:"Sugerencia lista", titulo:"Sugerencia lista", resumen:"Ley N.° 21.643 · 3 artículos", modo:"Modo oficial" },
  "contingencia": { fondo:"#FFF2BF", texto:"#4D3A00", acento:"#8F6B00", etiqueta:"Lista · modo de respaldo", titulo:"Sugerencia lista, con aviso", resumen:"Ley N.° 21.643 · 3 artículos", modo:"Modo de respaldo",
    aviso:"Esta sugerencia se preparó con un método alternativo porque el servicio principal no estaba disponible. Puede ser menos precisa: revisa cada artículo con especial atención." },
  "revision-tiempo": { fondo:"#FFE2C4", texto:"#5C2C05", acento:"#A85400", etiqueta:"Revisión manual · demoró", titulo:"Kerna no alcanzó a terminar a tiempo", resumen:"Sin sugerencia", modo:"Revisión manual",
    que:"La sugerencia tardó más de lo previsto y se detuvo.", significa:"Para este caso no habrá sugerencia de Kerna.", puedes:"Clasifícalo manualmente como siempre.", acciones:["Clasificar manualmente"] },
  "revision-citas": { fondo:"#EAE4F7", texto:"#2E1F63", acento:"#6A4FB3", etiqueta:"Revisión manual · citas sin confirmar", titulo:"La sugerencia no pasó la revisión de citas", resumen:"Sin sugerencia", modo:"Revisión manual",
    que:"Kerna preparó una sugerencia, pero no se pudo comprobar que sus citas coincidieran con el texto de las leyes.", significa:"Por seguridad no se muestra ningún artículo para este caso.", puedes:"Clasifícalo manualmente como siempre.", acciones:["Clasificar manualmente"] },
  "sin-normativa": { fondo:"#DDEFF0", texto:"#0F4249", acento:"#2C7C86", etiqueta:"Sin normativa encontrada", titulo:"Kerna no encontró normativa aplicable", resumen:"Sin artículos sugeridos", modo:"Revisión manual",
    que:"Kerna no encontró en su base de normas artículos que correspondan con claridad a este caso.", significa:"No quiere decir que no exista normativa aplicable, sino que Kerna no puede sugerir una.", puedes:"Clasifícalo según tu criterio.", acciones:["Clasificar manualmente"] },
  "cadena-agotada": { fondo:"#FDE0DD", texto:"#7A1212", acento:"#C62828", etiqueta:"Revisión manual · sin sugerencia", titulo:"Kerna no pudo preparar la sugerencia", resumen:"Sin sugerencia", modo:"Revisión manual",
    que:"Kerna no pudo preparar una sugerencia para este caso por un problema en sus servicios.", significa:"Para este caso no habrá sugerencia.", puedes:"Clasifícalo manualmente. Si el problema se repite, informa el código de seguimiento.", acciones:["Clasificar manualmente"] },
  "nucleo-no-disponible": { fondo:"#FBDCEA", texto:"#6B0F3B", acento:"#B02A6B", etiqueta:"Kerna no disponible", titulo:"Kerna no está disponible ahora", resumen:"Sin resultados todavía", modo:"Se sigue intentando",
    que:"Kerna no está disponible en este momento.", significa:"El caso quedó en espera; se sigue intentando automáticamente.", puedes:"Puedes clasificar el caso como siempre; la sugerencia aparecerá aquí cuando Kerna vuelva.", acciones:["Actualizar","Clasificar manualmente"] },
  "conector-inactivo": { fondo:"#E7E2D6", texto:"#433818", acento:"#7D6D45", etiqueta:"Kerna sin respuesta", titulo:"Kerna aún no ha tomado este caso", resumen:"Sin resultados", modo:"No disponible",
    que:"Ya pasó el tiempo habitual y Kerna no ha tomado este caso. Puede que la conexión con Kerna esté detenida o que no tenga acceso a este caso.", significa:"Por ahora no habrá sugerencia.", puedes:"Clasifícalo como siempre. Si pasa en varios casos, avisa a la persona administradora.", acciones:["Actualizar","Clasificar manualmente"] },
  "sin-conexion": { fondo:"#323A49", texto:"#FFFFFF", acento:"#FFFFFF", etiqueta:"Sin conexión", titulo:"No se pudo actualizar la información", resumen:"Último estado conocido: sugerencia lista", modo:"Puede estar desactualizado",
    que:"No se pudo actualizar este caso: la conexión se interrumpió o la plataforma está en mantenimiento.", significa:"Lo que ves puede estar desactualizado.", puedes:"Espera unos minutos y vuelve a intentarlo. Tu trabajo ya guardado no se pierde.", acciones:["Reintentar"] },
  "valorada": { fondo:"#205782", texto:"#FFFFFF", acento:"#FFFFFF", etiqueta:"Clasificación guardada", titulo:"Clasificación final guardada", resumen:"2 sugeridos aplicados · 1 agregado por ti", modo:"Modo oficial" }
};
const VARIANTES = { "respaldo": ["Lista · modo de respaldo", "Modo de respaldo"], "local": ["Lista · modo local", "Modo local"], "recuperacion-local": ["Lista · búsqueda local", "Búsqueda de normativa en modo local"] };
const ARTS = [
  ["Ley N.° 21.643 · Art. 2", "Explicación de ejemplo: por qué este artículo se relaciona con los hechos descritos en el caso.", "Texto de ejemplo de la cita literal del artículo, tal como figura en la ley."],
  ["Ley N.° 21.643 · Art. 3", "Explicación de ejemplo para el segundo artículo sugerido.", "Texto de ejemplo de la cita literal del segundo artículo."],
  ["Ley N.° 21.643 · Art. 5", "Explicación de ejemplo para el tercer artículo sugerido.", "Texto de ejemplo de la cita literal del tercer artículo."]
];
const q = new URLSearchParams(location.search);
const icono = ICONOS[q.get("icono")] ? q.get("icono") : "robot";
const estadoId = ESTADOS[q.get("estado")] ? q.get("estado") : "lista";
const variante = VARIANTES[q.get("variante")] ? q.get("variante") : "respaldo";
const conTooltip = q.get("tooltip") !== "0", conPanel = q.get("panel") !== "0";
const E = Object.assign({}, ESTADOS[estadoId]);
if (estadoId === "contingencia") { E.etiqueta = VARIANTES[variante][0]; E.modo = VARIANTES[variante][1]; }
const root = document.documentElement;
root.style.setProperty("--k-fondo", E.fondo); root.style.setProperty("--k-texto", E.texto); root.style.setProperty("--k-acento", E.acento);

const SV = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const T = { atras: SV('<path d="M19 12H5M11 6l-6 6 6 6"/>'), est: SV('<path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.200 9.400l6.100-.8z"/>'), camp: SV('<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>'), usr: SV('<circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c.5-4 3-6 6.500-6s6 2 6.500 6M16 5a3 3 0 0 1 0 6M18 14c2 .6 3.300 2.500 3.500 6"/>'), eng: SV('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'), desc: SV('<path d="M12 3v12M6 10l6 6 6-6M4 20h16"/>'), rec: SV('<path d="M20 11a8 8 0 1 0-2.300 5.700M20 4v7h-7"/>'), arr: SV('<path d="M7 11V20M7 11l4-8c2 0 3 1 3 3v3h6l-1 9H7"/>'), abj: SV('<path d="M7 13V4M7 13l4 8c2 0 3-1 3-3v-3h6l-1-9H7"/>') };

function indicador() {
  return `<button type="button" class="kerna-ind" id="kerna-ind" data-estado="${estadoId}" aria-describedby="kerna-tt" aria-expanded="${conPanel}" aria-controls="kerna-panel">
    <span class="kerna-ico">${ICONOS[icono]}<span class="kerna-glifo" style="color:${E.acento}">${GLIFOS[estadoId]}</span></span>
    <span class="kerna-lbl"><span class="sr-only">Kerna: </span>${E.etiqueta}</span></button>`;
}
function tooltip() {
  return `<div class="kerna-tt" id="kerna-tt" role="tooltip"><div class="t">${E.titulo}</div>
  <dl><dt>Resumen</dt><dd>${E.resumen}</dd><dt>Modo</dt><dd>${E.modo}</dd></dl>
  <div class="abrir">Abre el detalle con clic o <kbd>Enter</kbd>. <kbd>Esc</kbd> cierra este aviso.</div></div>`;
}
function articulos() {
  return ARTS.map((a, i) => `<div class="art"><div class="art-h"><span>${a[0]}</span><label class="chk"><input type="checkbox" ${estadoId === "valorada" && i < 2 ? "checked" : ""} ${estadoId === "valorada" ? "disabled" : ""}> ${estadoId === "valorada" ? "Aplicado" : "Incluir en la clasificación"}</label></div>
   <div class="art-b"><p>${a[1]}</p><blockquote>${a[2]} <span class="ej">(texto de ejemplo)</span></blockquote>
   <div class="fila"><a href="#" onclick="return false">Ver el artículo en la Biblioteca del Congreso Nacional</a>
   <span class="val" role="group" aria-label="¿Es útil esta sugerencia?"><button type="button" aria-pressed="${i === 0}" aria-label="Útil">${T.arr}</button><button type="button" aria-pressed="false" aria-label="No útil">${T.abj}</button></span></div>
   ${i === 0 && estadoId !== "valorada" ? `<label for="obs" style="display:block;margin-top:6px;font-size:13px">Observación (opcional)</label><textarea id="obs" maxlength="500" aria-describedby="cnt">Observación de ejemplo.</textarea><div class="cnt" id="cnt">23/500</div>` : ""}</div></div>`).join("");
}
function panel() {
  const sug = ["lista", "contingencia", "valorada"].includes(estadoId);
  let cuerpo = "";
  if (estadoId === "contingencia") cuerpo += `<div class="aviso cont" role="note"><b>Modo alternativo.</b> ${E.aviso}</div>`;
  cuerpo += `<div class="aviso" role="note">Sugerencia asistida: no es un dictamen jurídico. La decisión y la clasificación final son tuyas.</div>`;
  if (sug) {
    cuerpo += articulos() + `<div class="fila"><label for="otro">Agregar otro artículo</label><input id="otro" style="border:1px solid #58606E;border-radius:6px;padding:5px 8px;font:inherit" placeholder="Ej.: Ley N.° 20.393, art. 3" ${estadoId === "valorada" ? "disabled" : ""}></div>`;
    cuerpo += estadoId === "valorada" ? `<p style="margin-top:10px"><b>Clasificación guardada:</b> 2 artículos sugeridos aplicados y 1 agregado por ti. No sugeridos por Kerna: 1.</p>` : `<div class="acciones"><button class="btn" type="button">Guardar clasificación</button><button class="btn sec" type="button">Ninguno aplica</button></div>`;
  } else {
    cuerpo += `<div class="msg"><b>Qué pasó</b><p>${E.que}</p><b>Qué significa para este caso</b><p>${E.significa}</p><b>Qué puedes hacer</b><p>${E.puedes}</p></div><div class="acciones">${E.acciones.map((x, i) => `<button class="btn ${i ? "sec" : ""}" type="button">${x}</button>`).join("")}</div>`;
  }
  const codigo = estadoId === "sin-info" || estadoId === "conector-inactivo" ? "" : `<div class="pie"><span>Código de seguimiento (para reportar un problema): <code>8f3a2c1e-9b47</code></span><button class="btn sec" type="button">Copiar código</button></div>`;
  return `<section class="card k-panel" id="kerna-panel" aria-labelledby="kerna-h"><div class="card-h"><h2 id="kerna-h">${ICONOS[icono]} Sugerencia normativa de Kerna</h2><span class="k-chip">${E.etiqueta}</span></div><div class="card-b">${cuerpo}${codigo}</div></section>`;
}
function hojaIconos() {
  let h = `<div class="hoja"><b>Opción</b><b>24 px</b><b>20 px</b><b>16 px</b>`;
  for (const k of Object.keys(ICONOS)) {
    const ic = (px) => ICONOS[k].replace('class="icono"', `class="icono" width="${px}" height="${px}" style="width:${px}px;height:${px}px"`);
    h += `<span>${k}</span><span class="i">${ic(24)}</span><span class="i">${ic(20)}</span><span class="i">${ic(16)}</span>`;
  }
  h += `</div><div class="hoja"><b>Sobre fondo oscuro</b>` + Object.keys(ICONOS).map(k => `<span class="oscuro">${ICONOS[k].replace('class="icono"', 'class="icono" style="width:24px;height:24px"')}</span>`).join("") + `</div>`;
  return h;
}
