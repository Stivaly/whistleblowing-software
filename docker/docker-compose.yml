services:
  globaleaks:
    build:                                
      context: ..                         
      dockerfile: docker/Dockerfile
    environment:
      DISTRIBUTION: trixie
    restart: unless-stopped
    container_name: veridy

    ports:
      - "10.147.17.68:80:8080"
      - "10.147.17.68:443:8443"
      - "10.147.17.68:8080:8080"
      - "10.147.17.68:8443:8443"

    volumes:
      - docker_globaleaks:/var/globaleaks:rw

    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/api/health"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  docker_globaleaks:
    external: true


