# Veridy + Kerna en este computador. Lo usan Instalar / Detener; no hace falta abrirlo.
# Solo se abren puertos en este computador (127.0.0.1). Hacia internet sale HTTPS (443) a Kerna en Azure y
# PostgreSQL (5432, con TLS) a la base de Veridy en Azure: las denuncias, cuentas y configuración son las de Azure.
name: veridy-kerna

x-red-salida: &salida
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  HTTP_PROXY: ${HTTP_PROXY:-}
  NO_PROXY: veridy,panel,inicio,localhost,127.0.0.1

services:
  veridy:
    image: veridy-local:${VERSION}
    restart: unless-stopped
    ports: ["127.0.0.1:${PUERTO_VERIDY:-8401}:8080"]
    volumes: ["veridy-trabajo:/var/globaleaks"]  # solo logs y temporales; los datos están en Azure
    environment:
      VERIDY_PG_FQDN: ${VERIDY_PG_FQDN}
      VERIDY_DB_CLAVE: ${VERIDY_DB_CLAVE}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/api/health',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 60s

  conector:
    image: kerna-conector-local:${VERSION}
    restart: unless-stopped
    depends_on:
      veridy: {condition: service_healthy}
    volumes: ["conector-datos:/datos"]
    environment:
      <<: *salida
      VERIDY_URL: http://veridy:8080
      VERIDY_USUARIO: kerna-conector
      VERIDY_PASSWORD: ${VERIDY_CONECTOR_CLAVE}
      KERNA_API_URL: ${KERNA_API_URL}
      KERNA_CLIENT_ID: ${KERNA_CLIENT_ID}
      KERNA_CLIENT_SECRET: ${KERNA_CLIENT_SECRET}
      KERNA_ID_EMPRESA: ${KERNA_ID_EMPRESA}
      KERNA_TABLAS_URL: ${KERNA_TABLAS_URL}
      CONECTOR_INTERVALO_S: "20"
      CONECTOR_ESTADO: postgresql://kerna_conector:${CONECTOR_PG_CLAVE_URL}@${VERIDY_PG_FQDN}:5432/kerna_conector?sslmode=verify-full&sslrootcert=/etc/ssl/certs/ca-certificates.crt
      VERIDY_COMPARTIR_CON: ${VERIDY_COMPARTIR_CON}
      VERIDY_COMPARTIR_SIEMPRE: ${VERIDY_COMPARTIR_SIEMPRE}
      IDENTITY_ENDPOINT: ${IDENTITY_ENDPOINT}
      IDENTITY_HEADER: ${IDENTITY_HEADER}

  panel:
    image: kerna-panel-local:${VERSION}
    restart: unless-stopped
    ports: ["127.0.0.1:${PUERTO_PANEL:-8402}:8000"]
    environment:
      <<: *salida
      FRONT_AUTH: clave
      FRONT_CLAVE: ${FRONT_CLAVE}
      LOG_ANALYTICS_WORKSPACE_ID: ${LOG_ANALYTICS_WORKSPACE_ID}
      EVALUACIONES_TABLA_URL: ${KERNA_TABLAS_URL}
      NEGOCIO_TABLA_URL: ${KERNA_TABLAS_URL}
      CUENTAS_TABLA_URL: ${KERNA_TABLAS_URL}
      REINTENTOS_TABLA_URL: ${KERNA_TABLAS_URL}
      OPENAI_RECURSO_ID: ${OPENAI_RECURSO_ID}
      AZ_SUSCRIPCION_ID: ${AZ_SUSCRIPCION_ID}
      KERNA_NUCLEO_URL: ${KERNA_API_URL}
      DEMO_CLIENT_ID: ${DEMO_CLIENT_ID}
      DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET}
      IDENTITY_ENDPOINT: ${IDENTITY_ENDPOINT}
      IDENTITY_HEADER: ${IDENTITY_HEADER}

  inicio:
    image: kerna-panel-local:${VERSION}
    restart: unless-stopped
    command: ["python", "/app/lanzador/lanzador.py"]
    ports: ["127.0.0.1:${PUERTO_INICIO:-8400}:8400"]
    environment:
      <<: *salida
      NUBE_SALUD: ${KERNA_API_URL}/salud
      VERIDY_PUBLICA: http://localhost:${PUERTO_VERIDY:-8401}
      PANEL_PUBLICO: http://localhost:${PUERTO_PANEL:-8402}
      VERIDY_AUDITOR_USUARIO: ${VERIDY_AUDITOR_USUARIO}
      VERIDY_AUDITOR_CLAVE: ${VERIDY_AUDITOR_CLAVE}
      KERNA_PANEL_USUARIO: ${KERNA_PANEL_USUARIO}
      KERNA_PANEL_CLAVE: ${KERNA_PANEL_CLAVE}

volumes:
  veridy-trabajo:
  conector-datos:
